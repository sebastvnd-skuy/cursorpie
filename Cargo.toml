[package]
name = "cursorpie"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Hold-to-open pie menu for macOS: per-app profiles, shortcuts, launchers and submenus."
license = "MIT"

authors = ["Your Name sebastvnd@gmail.com"]
repository = "https://github.com/sebastvnd/cursorpie"

[dependencies]
# UI (egui 0.36 uses `App::ui` + `App::logic`, same as the original code)
eframe = "0.36"

# Event tap. Keep the core-graphics / core-foundation versions that already
# compile in your current project if they differ from these.
core-graphics = "0.25"
core-foundation = "0.10"

# Menu bar icon (muda menus are re-exported as `tray_icon::menu`)
tray-icon = "0.25"

# Frontmost app (per-app profiles) and activation policy (no Dock icon)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
] }

# Config + icons
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
