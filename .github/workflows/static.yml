
name: Deploy CursorPie Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/

          for file in README.md CHANGELOG.md CONTRIBUTING.md; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

          if [ -d docs ]; then
            cp -R docs _site/
          fi

          if [ -f diag/README.md ]; then
            mkdir -p _site/diag
            cp diag/README.md _site/diag/
          fi

          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
