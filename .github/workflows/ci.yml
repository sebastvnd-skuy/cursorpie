name: CI

# Pull requests and `main` are checked. A branch without a pull request is not: open a draft pull
# request to get CI on it. A `v*` tag also checks that the tag matches the release in the files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A new push to a pull request replaces the run that is still going; runs on main and tags finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # One command for everything, so what passes on your machine passes here (tools/src/ci.rs
      # holds the list: format, version files, clippy, tests, doc tests, docs on macOS, and the
      # Windows backend checks on macOS and Linux).
      - name: Checks
        run: cargo tools ci
      - name: Build release
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release
      # The tag of a release must be the version in Cargo.toml, with the notes moved out of
      # "Unreleased" (see CONTRIBUTING.md, "Releasing").
      - name: Tag matches the release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        env:
          TAG: ${{ github.ref_name }}
        run: cargo tools check --tag "$TAG"
